<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>high-end-product-video · scene template</title>
<!--
  ============================================================
  默认场景模板（editorial / dark 双主题）
  ============================================================
  与渲染器的契约（render_frames.py 按此调用）：
    1. URL 参数：?scene=<index>&visual=<title|feature|metric|outro|custom>
                &theme=<editorial|dark>&w=<px>&h=<px>&seed=<int>
    2. 模板把 scene 数据放进 window.__SCENE__（来自时间轴 + visual 覆盖）
    3. 渲染器逐帧调用 window.__render(t)，t = 该镜头内经过的秒数
    4. __render(t) 必须是纯函数：同样 t 永远画出同一帧（禁止 Math.random）
    5. 模板不得依赖任何网络资源（字体/图片全部本地或系统栈）

  换主题只改 :root 里的 CSS 变量；换版式改 .scene-* 区块。
  ============================================================
-->
<style>
:root {
  /* ---- editorial 主题（默认，品牌色）---- */
  --bg: #FAF8F5;
  --bg-deep: #F2EDE4;
  --ink: #2C2C2A;
  --ink-soft: rgba(44, 44, 42, 0.62);
  --ink-faint: rgba(44, 44, 42, 0.32);
  --green: #1B3A2E;
  --green-deep: #12261E;
  --bronze: #C8A35E;
  --bronze-deep: #A8854A;
  --wine: #5C1A1B;
  --card: #FFFFFF;
  --line: rgba(27, 58, 46, 0.16);
  --glow: rgba(200, 163, 94, 0.30);
  --orb-a: rgba(27, 58, 46, 0.50);
  --orb-b: rgba(200, 163, 94, 0.42);
  --grain-opacity: 0.05;
  --vignette: rgba(27, 58, 46, 0.14);
}
:root[data-theme="dark"] {
  --bg: #12261E;
  --bg-deep: #0C1A14;
  --ink: #F2EDE4;
  --ink-soft: rgba(242, 237, 228, 0.66);
  --ink-faint: rgba(242, 237, 228, 0.34);
  --green: #F2EDE4;
  --green-deep: #C8A35E;
  --bronze: #C8A35E;
  --bronze-deep: #E3C88F;
  --wine: #C98A8A;
  --card: #1B3A2E;
  --line: rgba(242, 237, 228, 0.18);
  --glow: rgba(200, 163, 94, 0.22);
  --orb-a: rgba(200, 163, 94, 0.34);
  --orb-b: rgba(27, 58, 46, 0.55);
  --grain-opacity: 0.07;
  --vignette: rgba(0, 0, 0, 0.42);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
               "Microsoft YaHei", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.stage {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at var(--bx, 78%) var(--by, 12%), var(--bg-deep) 0%, var(--bg) 58%),
    var(--bg);
}

/* ---------- 图层通用 ---------- */
.layer { position: absolute; inset: 0; will-change: transform, opacity; }
.safe {
  position: absolute; inset: 0;
  padding: 8% 8.5%;
  display: flex; flex-direction: column; justify-content: center;
  transform: translateY(calc(var(--py, 0) * 1px));
}

.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(115% 88% at 50% 46%, transparent 58%, var(--vignette) 100%);
}

/* ---------- 画布光斑层 ---------- */
#orbs { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- 标题条 ---------- */
.eyebrow {
  display: flex; align-items: center; gap: 0.9em;
  font-size: clamp(15px, 1.45vw, 30px);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--bronze-deep);
  font-weight: 600;
  opacity: var(--e, 0);
  transform: translateY(calc(18px * (1 - var(--e, 0))));
}
.eyebrow::before {
  content: ""; width: 2.6em; height: 2px; background: var(--bronze);
  transform: scaleX(var(--e, 0)); transform-origin: left center;
}

/* ---------- 展示标题（词级遮罩reveal） ---------- */
.display {
  font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  font-weight: 700;
  font-size: clamp(44px, 6.2vw, 128px);
  line-height: 1.14;
  letter-spacing: 0.012em;
  margin-top: 0.42em;
  color: var(--green);
}
.display .word { display: inline-block; overflow: hidden; vertical-align: bottom; }
.display .word > span {
  display: inline-block;
  transform: translateY(calc(108% * (1 - var(--w, 0))));
  opacity: var(--w, 0);
}
.display .accent { color: var(--wine); }

.caption {
  margin-top: 1.5em;
  font-size: clamp(16px, 1.62vw, 34px);
  line-height: 1.62;
  color: var(--ink-soft);
  max-width: 34em;
  font-weight: 400;
  opacity: var(--c, 0);
  transform: translateY(calc(16px * (1 - var(--c, 0))));
}

/* ---------- 数据指标 ---------- */
.metric-wrap { align-items: center; text-align: center; }
.metric-num {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  font-size: clamp(96px, 15vw, 320px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  opacity: var(--e, 0);
  transform: scale(calc(1 + 0.06 * (1 - var(--e, 0))));
}
.metric-unit {
  font-size: 0.32em; color: var(--bronze-deep); margin-left: 0.12em;
  letter-spacing: 0.06em; font-weight: 600;
}
.metric-cap {
  margin-top: 0.7em;
  font-size: clamp(16px, 1.7vw, 36px);
  color: var(--ink-soft);
  letter-spacing: 0.06em;
  opacity: var(--c, 0);
}
.metric-rule {
  width: 5.5em; height: 2px; background: var(--bronze);
  margin: 1.1em auto 0;
  transform: scaleX(var(--e, 0));
}
.metric-glow {
  position: absolute; left: 50%; top: 46%;
  width: 62vmin; height: 62vmin; transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
  pointer-events: none;
  opacity: calc((0.5 + 0.22 * var(--pulse, 0)) * var(--e, 0));
}

/* ---------- 特性卡（左文右卡） ---------- */
.split { display: grid; grid-template-columns: 1.02fr 0.98fr; gap: 5%; align-items: center; }
.split .copy { padding-right: 2%; }
.split .body {
  margin-top: 1.4em;
  font-size: clamp(15px, 1.5vw, 32px);
  line-height: 1.72; color: var(--ink-soft);
  opacity: var(--c, 0);
  transform: translateY(calc(16px * (1 - var(--c, 0))));
}
.tags { margin-top: 2.1em; display: flex; flex-wrap: wrap; gap: 0.7em; }
.tag {
  font-size: clamp(12px, 1.05vw, 22px);
  letter-spacing: 0.14em;
  padding: 0.62em 1.15em;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--green);
  background: rgba(255, 255, 255, 0.72);
  opacity: var(--e, 0);
  transform: translateY(calc(12px * (1 - var(--e, 0))));
}

/* 产品卡 mockup */
.mock {
  position: relative;
  aspect-ratio: 4 / 3.1;
  transform: translateY(calc(26px * (1 - var(--e, 0)) + var(--float, 0) * 1px));
  border-radius: clamp(14px, 1.5vw, 30px);
  background:
    linear-gradient(150deg, rgba(200, 163, 94, 0.12) 0%, rgba(200, 163, 94, 0) 42%),
    linear-gradient(150deg, var(--card) 0%, var(--bg-deep) 100%);
  box-shadow:
    0 32px 80px -28px rgba(18, 38, 30, 0.42),
    0 4px 14px -6px rgba(18, 38, 30, 0.18),
    inset 0 0 0 1px rgba(255, 255, 255, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
  overflow: hidden;
  opacity: var(--e, 0);
}
.mock .aurora {
  position: absolute; inset: -30%;
  background: conic-gradient(from 0deg, transparent 0%, var(--glow) 12%, transparent 26%,
              transparent 62%, var(--glow) 74%, transparent 88%);
  transform: rotate(var(--sweep, 0deg));
  filter: blur(18px);
}
.mock .rows { position: absolute; inset: 0; padding: 9% 8.5%; display: flex; flex-direction: column; gap: 5.2%; }
.mock .row {
  height: 8.5%; border-radius: 6px;
  background: linear-gradient(90deg, var(--line), transparent 78%);
}
.mock .row.hi {
  background: linear-gradient(90deg, var(--bronze), transparent 66%);
  opacity: 0.85;
}
.mock .chip {
  position: absolute; right: 7%; top: 9%;
  padding: 0.5em 0.95em; border-radius: 999px;
  background: var(--green); color: var(--bg);
  font-size: clamp(10px, 0.85vw, 18px); letter-spacing: 0.16em; font-weight: 600;
}
.float-tag {
  position: absolute;
  padding: 0.55em 1em; border-radius: 12px;
  background: var(--card); color: var(--green);
  border: 1px solid var(--line);
  box-shadow: 0 18px 44px -20px rgba(18, 38, 30, 0.38);
  font-size: clamp(11px, 0.95vw, 20px); letter-spacing: 0.08em; font-weight: 600;
  opacity: var(--e, 0);
}

/* ---------- 落版 ---------- */
.outro { align-items: center; text-align: center; }
.scene-outro .safe { transform: scale(var(--zoom, 1)) translateY(calc(var(--py, 0) * 1px)); }
.lockup { display: flex; align-items: center; gap: 0.62em; opacity: var(--e, 0); }
.lockup .mark {
  width: clamp(44px, 4.6vw, 96px); height: clamp(44px, 4.6vw, 96px);
  border-radius: 22%;
  background: linear-gradient(140deg, var(--green) 0%, var(--green-deep) 100%);
  display: grid; place-items: center;
  color: var(--bronze);
  font-family: Georgia, serif; font-weight: 700;
  font-size: clamp(22px, 2.3vw, 48px);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 18px 40px -18px rgba(18,38,30,0.5);
}
.lockup .wordmark {
  font-family: Georgia, serif; font-weight: 700;
  font-size: clamp(26px, 2.9vw, 60px); letter-spacing: 0.05em; color: var(--green);
}
.outro .tagline {
  margin-top: 1.6em;
  font-size: clamp(15px, 1.5vw, 32px); color: var(--ink-soft); letter-spacing: 0.2em;
  opacity: var(--c, 0);
}
.outro .hairline {
  margin-top: 2.2em; width: 7em; height: 1px; background: var(--bronze);
  transform: scaleX(var(--e, 0));
}

/* ---------- 转场黑场（镜头首尾 0.25s 交错窗口，与 assemble 的 cut 对齐） ---------- */
.cutfade {
  position: absolute; inset: 0; pointer-events: none;
  background: var(--bg);
  opacity: calc((1 - var(--x, 1)) * 0.9);
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="orbs"></canvas>

  <!-- 标题型 -->
  <section class="layer scene-title" id="scene-title" hidden>
    <div class="safe">
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 class="display" id="t-display"></h1>
      <p class="caption" id="t-caption"></p>
    </div>
  </section>

  <!-- 特性型 -->
  <section class="layer scene-feature" id="scene-feature" hidden>
    <div class="safe">
      <div class="split">
        <div class="copy">
          <div class="eyebrow" id="f-eyebrow"></div>
          <h1 class="display" id="f-display" style="font-size:clamp(38px,4.4vw,92px)"></h1>
          <p class="body" id="f-body"></p>
          <div class="tags" id="f-tags"></div>
        </div>
        <div class="mock" id="f-mock">
          <div class="aurora"></div>
          <div class="rows">
            <div class="row hi"></div><div class="row"></div><div class="row"></div>
            <div class="row hi"></div><div class="row"></div>
          </div>
          <div class="chip" id="f-chip"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 数据型 -->
  <section class="layer scene-metric" id="scene-metric" hidden>
    <div class="metric-glow"></div>
    <div class="safe metric-wrap">
      <div class="metric-num"><span id="m-num">0</span><span class="metric-unit" id="m-unit"></span></div>
      <div class="metric-rule"></div>
      <div class="metric-cap" id="m-cap"></div>
    </div>
  </section>

  <!-- 落版 -->
  <section class="layer scene-outro" id="scene-outro" hidden>
    <div class="safe outro">
      <div class="lockup">
        <div class="mark" id="o-mark">A</div>
        <div class="wordmark" id="o-wordmark"></div>
      </div>
      <div class="hairline"></div>
      <div class="tagline" id="o-tagline"></div>
    </div>
  </section>

  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="cutfade"></div>
</div>

<script>
"use strict";
/* ================= 契约数据 ================= */
const params = new URLSearchParams(location.search);
const SCENE = {
  index: parseInt(params.get("scene") || "1", 10),
  text: params.get("text") || "",
  visual: params.get("visual") || "title",
  duration: parseFloat(params.get("duration") || "5"),
  eyebrow: params.get("eyebrow") || "",
  caption: params.get("caption") || "",
  tags: (params.get("tags") || "").split("|").filter(Boolean),
  metric: params.get("metric") || "",
  unit: params.get("unit") || "",
  wordmark: params.get("wordmark") || "PRODUCT",
  tagline: params.get("tagline") || "",
};
window.__SCENE__ = SCENE;

const root = document.documentElement;
root.dataset.theme = params.get("theme") || "editorial";

/* ================= 工具 ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Apple 标准流体曲线
const easeOutExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const ease = t => { const c = 0.16; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 中文按词组切分做 reveal 单位，西文按空格
function tokenize(s) {
  if (!s) return [];
  if (/[\u4e00-\u9fa5]/.test(s)) {
    return s.replace(/([，。；：、,.!?！？])/g, " $1 ").split(/\s+/).filter(Boolean);
  }
  return s.split(/\s+/).filter(Boolean);
}

/* ================= 词级 reveal ================= */
function buildDisplay(el, text, accentFrom) {
  el.innerHTML = "";
  const tokens = tokenize(text);
  tokens.forEach((tk, i) => {
    const w = document.createElement("span");
    w.className = "word";
    const inner = document.createElement("span");
    inner.textContent = tk;
    if (accentFrom && i >= accentFrom) inner.classList.add("accent");
    w.appendChild(inner);
    el.appendChild(w);
    el.appendChild(document.createTextNode(" "));
  });
  return tokens.map((_, i) => el.querySelectorAll(".word > span")[i]);
}

/* ================= 画布光斑（确定性，t 纯函数） ================= */
const canvas = document.getElementById("orbs");
const ctx = canvas.getContext("2d");
let ORBS = [];
let ORB_COLORS = ["rgba(27,58,46,0.50)", "rgba(200,163,94,0.42)"];
function initOrbs(w, h, seed) {
  const rnd = mulberry32(seed || 7);
  const n = w < 700 ? 9 : 14;
  ORBS = [];
  for (let i = 0; i < n; i++) {
    ORBS.push({
      x: rnd(), y: rnd(),
      r: 0.10 + rnd() * 0.30,
      sx: 0.006 + rnd() * 0.012,
      sy: 0.004 + rnd() * 0.010,
      ph: rnd() * Math.PI * 2,
      hue: rnd() > 0.45 ? 0 : 1,
    });
  }
  // 主题色只读一次，避免每帧 getComputedStyle
  const cs = getComputedStyle(root);
  ORB_COLORS = [
    cs.getPropertyValue("--orb-a").trim() || ORB_COLORS[0],
    cs.getPropertyValue("--orb-b").trim() || ORB_COLORS[1],
  ];
}
function drawOrbs(t, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.filter = "blur(26px)";
  for (const o of ORBS) {
    // 有界漂移：振幅受 clamp，永不飞出画面
    const dx = Math.sin(t * o.sx * 6 + o.ph) * 0.06;
    const dy = Math.cos(t * o.sy * 6 + o.ph) * 0.05;
    const x = clamp(o.x + dx, -0.1, 1.1) * w;
    const y = clamp(o.y + dy, -0.1, 1.1) * h;
    const r = o.r * Math.min(w, h) * (0.94 + 0.06 * Math.sin(t * 0.5 + o.ph));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, ORB_COLORS[o.hue]);
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.filter = "none";
}

/* ================= 场景装配 ================= */
let WORD_SPANS = [];
function mountScene() {
  const v = SCENE.visual;
  const show = id => { document.querySelectorAll(".layer").forEach(el => el.hidden = true); document.getElementById(id).hidden = false; };

  if (v === "feature") {
    show("scene-feature");
    document.getElementById("f-eyebrow").textContent = SCENE.eyebrow || "核心能力";
    buildDisplay(document.getElementById("f-display"), SCENE.text, 0);
    document.getElementById("f-body").textContent = SCENE.caption;
    document.getElementById("f-chip").textContent = "LIVE";
    const tags = document.getElementById("f-tags");
    tags.innerHTML = "";
    (SCENE.tags.length ? SCENE.tags : ["即开即用", "开箱即测"]).forEach(tg => {
      const s = document.createElement("span");
      s.className = "tag"; s.textContent = tg; tags.appendChild(s);
    });
  } else if (v === "metric") {
    show("scene-metric");
    const m = (SCENE.metric || (SCENE.text.match(/[\d.]+/) || [""])[0]);
    document.getElementById("m-num").dataset.target = m || "0";
    document.getElementById("m-unit").textContent = SCENE.unit;
    document.getElementById("m-cap").textContent = SCENE.caption || SCENE.text;
  } else if (v === "outro") {
    show("scene-outro");
    document.getElementById("o-wordmark").textContent = SCENE.wordmark;
    document.getElementById("o-tagline").textContent = SCENE.tagline || SCENE.text;
  } else {
    show("scene-title");
    document.getElementById("t-eyebrow").textContent = SCENE.eyebrow || "产品特性";
    WORD_SPANS = buildDisplay(document.getElementById("t-display"), SCENE.text, 0);
    document.getElementById("t-caption").textContent = SCENE.caption;
  }
}

/* ================= 每帧渲染（纯函数 of t） ================= */
function __render(t) {
  const d = Math.max(0.001, SCENE.duration);
  const p = clamp(t / d, 0, 1);

  // 入场 0.9s（指数缓出），出场 0.35s（与相邻镜头交错窗口对齐）
  const eIn = easeOutExpo(clamp(t / 0.9, 0, 1));
  const eOut = clamp((d - t) / 0.35, 0, 1);
  const vis = Math.min(eIn, eOut);

  // 停稳后的有界漂移（动量连续性：任何一帧都不完全静止）
  // 双不可通约频率叠加：单正弦在极值点速度为零，会出现一两帧几乎静止；
  // 叠一个不同频率的分量后，任意时刻合速度都不为零，运动全程连续。
  const drift = Math.sin(t * 0.8) * 0.013 + Math.sin(t * 1.37) * 0.008;
  const driftY = clamp(Math.cos(t * 1.2) * 5 + Math.sin(t * 0.93) * 4, -10, 10);

  const stage = document.getElementById("stage");
  stage.style.transform = `scale(${(1 + drift).toFixed(5)}) translateY(${driftY.toFixed(2)}px)`;
  // 背景渐变缓慢游移：整帧亮度呼吸，中段也不静止
  root.style.setProperty("--bx", (78 + 3.4 * Math.sin(t * 0.21) + 1.6 * Math.sin(t * 0.53)).toFixed(2) + "%");
  root.style.setProperty("--by", (12 + 2.6 * Math.cos(t * 0.17) + 1.2 * Math.cos(t * 0.41)).toFixed(2) + "%");
  // 文字层反向微动形成景深（0.35 倍振幅）
  root.style.setProperty("--py", (-driftY * 0.35).toFixed(2));
  root.style.setProperty("--sweep", (t * 200 % 360).toFixed(2) + "deg");

  drawOrbs(t, canvas.width, canvas.height);

  root.style.setProperty("--e", vis.toFixed(4));
  root.style.setProperty("--x", eOut.toFixed(4));

  // 各场景的持续动态（中段也不允许静止）
  root.style.setProperty("--pulse", (Math.sin(t * 0.9) + 0.4 * Math.sin(t * 1.53)).toFixed(4));
  root.style.setProperty("--float", (Math.sin(t * 0.7) * 4 + Math.sin(t * 1.21) * 2).toFixed(2));
  root.style.setProperty("--zoom", (1 + 0.035 * clamp(t / Math.max(0.001, d), 0, 1)).toFixed(4));

  if (SCENE.visual === "metric") {
    // 数字计数：1.4s 内指数缓出到目标值
    const numEl = document.getElementById("m-num");
    const target = parseFloat(numEl.dataset.target || "0");
    const kp = easeOutExpo(clamp(t / 1.4, 0, 1));
    const cur = target * kp;
    numEl.textContent = Number.isInteger(target) ? Math.round(cur).toString()
                                                 : cur.toFixed(Math.max(0, (String(target).split(".")[1] || "").length));
    root.style.setProperty("--c", clamp((t - 0.5) / 0.7, 0, 1).toFixed(4));
  } else if (WORD_SPANS.length) {
    // 词级错峰 reveal：每个词晚 0.09s 入场
    WORD_SPANS.forEach((sp, i) => {
      const w = clamp((t - 0.18 - i * 0.09) / 0.62, 0, 1);
      sp.style.setProperty("--w", easeOutExpo(w).toFixed(4));
    });
    root.style.setProperty("--c", clamp((t - 0.55) / 0.6, 0, 1).toFixed(4));
  } else {
    root.style.setProperty("--c", clamp((t - 0.45) / 0.6, 0, 1).toFixed(4));
  }
}

/* ================= 启动 ================= */
function resize() {
  const w = parseInt(params.get("w") || "1920", 10);
  const h = parseInt(params.get("h") || "1080", 10);
  // 光斑层按 0.5 分辨率渲染再 CSS 放大：模糊填充量降 4 倍，
  // 颗粒本身是低频色块，放大后看不出差别（逐帧截图关键路径）
  const ORB_SCALE = 0.5;
  canvas.width = Math.round(w * ORB_SCALE);
  canvas.height = Math.round(h * ORB_SCALE);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  document.body.style.width = w + "px";
  document.body.style.height = h + "px";
}
resize();
initOrbs(canvas.width, canvas.height, parseInt(params.get("seed") || "7", 10));
mountScene();
__render(0);
window.__READY__ = true;
</script>
</body>
</html>
